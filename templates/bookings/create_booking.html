{% extends 'base.html' %}

{% block content %}

<h2>{% if editing %}Edit Booking{% else %}Create Booking{% endif %}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if editing %}Submit Changes{% else %}Submit Booking Request{% endif %}</button>
</form>

<a href="{% url 'service_list' %}">Back to Services</a>

{% endblock %}
