{% extends 'base.html' %}

{% block content %}
<h2>Review History</h2>

{% if reviews %}
    <ul>
        {% for review in reviews %}
            <li>
                {{ review.worker.email }} - {{ review.rating }} stars<br>
                {{ review.comment }}
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No reviews found.</p>
{% endif %}

{% endblock %}
