{% extends 'base.html' %}
{% block title %}Submit Complaint — MJMS{% endblock %}
{% block content %}
<div class="card">
    <p class="section-kicker">Customer Support</p>
    <h1>Submit a Complaint</h1>
    <p>Tell us what happened with your booking so our support team can review it.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit Complaint</button>
        <a href="{% url 'complaint_history' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
