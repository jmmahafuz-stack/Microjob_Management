{% extends 'base.html' %}

{% block content %}
<h2>Payment for {{ booking.service.name }}</h2>
<p><strong>Amount due:</strong> ৳{{ booking.service.price }}</p>
<p><strong>Booking date:</strong> {{ booking.booking_date }}</p>
<p><strong>Booking time:</strong> {{ booking.booking_time }}</p>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Submit Payment</button>
</form>

<p><a href="{% url 'booking_detail' booking.pk %}">Back to booking</a></p>
{% endblock %}
