{% extends 'base.html' %}
{% block content %}
<section class="auth-section">
    <div class="auth-card auth-card--login">
        <div class="auth-card__header">
            <span class="section-kicker">Check your inbox</span>
            <h2>Reset link sent</h2>
            <p>If an account exists for that email, you will receive password reset instructions shortly.</p>
        </div>
        <a href="{% url 'login' %}" class="btn btn-primary btn-block">Back to sign in</a>
    </div>
</section>
{% endblock %}
