{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#163a56">
    <meta name="description" content="MJMS - trusted local services, bookings, workers and payments.">
    <title>{% block title %}MJMS — Micro Job Management System{% endblock %}</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="{% static 'css/professional.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/mjms-overrides.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_css %}{% endblock %}

<link rel="stylesheet" href="{% static 'css/service-filter-fix.css' %}">
    <link rel="stylesheet" href="{% static 'css/site-final.css' %}">
</head>
<body>
    {% include 'navbar.html' %}

    <main class="site-main">
        {% include 'partials/messages.html' %}
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}

    <script src="{% static 'js/site.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
