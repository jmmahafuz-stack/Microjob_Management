{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Verify Worker</h2>
    <p><strong>Worker:</strong> {{ worker_profile.user.email }}</p>
    <p><strong>Skills:</strong> {{ worker_profile.skills }}</p>
    <p><strong>Service area:</strong> {{ worker_profile.service_area }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Verification</button>
    </form>
</div>
{% endblock %}
